<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse RP HUD — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background:
        radial-gradient(ellipse at 70% 20%, rgba(14, 90, 180, 0.35), transparent 50%),
        radial-gradient(ellipse at 20% 80%, rgba(0, 40, 90, 0.45), transparent 45%),
        linear-gradient(160deg, #061018 0%, #0a1a2e 45%, #05101c 100%);
    }
    .preview-note {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(180, 210, 240, 0.35);
      font-family: "Rajdhani", sans-serif;
      pointer-events: none;
      z-index: 0;
    }
    .preview-note h1 {
      font-family: "Orbitron", sans-serif;
      font-size: 28px;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }
    .controls {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
      pointer-events: auto;
    }
    .controls button {
      pointer-events: auto;
      font-family: "Rajdhani", sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(46, 184, 255, 0.45);
      background: rgba(4, 20, 45, 0.9);
      color: #d8efff;
      cursor: pointer;
    }
    .controls button:hover {
      background: rgba(10, 70, 140, 0.9);
    }
  </style>
</head>
<body>
  <div class="preview-note">
    <h1>ECLIPSE ROLEPLAY</h1>
    <p>HUD browser preview — geen FiveM vereist</p>
  </div>

  <!-- same HUD markup as index.html -->
  <div id="hud" class="hud is-visible" aria-hidden="false">
    <aside class="panel panel--status" id="status-panel">
      <div class="panel__glow"></div>
      <div class="status-grid">
        <div class="status-left">
          <div class="logo-wrap">
            <img src="img/logo.jpg" alt="Eclipse RP" class="logo" draggable="false" />
            <div class="logo-ring"></div>
          </div>
          <div class="needs">
            <div class="need" data-need="hunger" title="Voeding">
              <div class="need__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 2v9.2c0 1.5-.9 2.8-2.2 3.4V21H7v-6.4C5.7 14 4.8 12.7 4.8 11.2V2h1.7v7.5h1.1V2H9v7.5h1.1V2H11zm9.2 0c0 4.2-2.2 6.5-4.4 7.1V21h-1.8V9.1C11.8 8.5 9.6 6.2 9.6 2h1.7c0 3.1 1.5 4.8 3 5.1V2h1.8v5.1c1.5-.3 3-2 3-5.1h1.7z"/></svg>
              </div>
              <div class="need__body">
                <div class="need__meta">
                  <span class="need__label">Voeding</span>
                  <span class="need__value" id="hunger-value">78%</span>
                </div>
                <div class="need__track">
                  <div class="need__fill need__fill--hunger" id="hunger-fill" style="width:78%"></div>
                </div>
              </div>
            </div>
            <div class="need" data-need="thirst" title="Drinken">
              <div class="need__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2c.4 0 .7.2.9.5l6.4 10.2c.6 1 .7 2.1.3 3.1-.4 1-1.2 1.8-2.2 2.2-.7.3-1.4.4-2.1.4H8.7c-.7 0-1.4-.1-2.1-.4-1-.4-1.8-1.2-2.2-2.2-.4-1-.3-2.1.3-3.1L11.1 2.7c.2-.3.5-.5.9-.5zm0 2.6L6.7 13.3c-.2.3-.2.6-.1.9.1.3.4.6.7.7.2.1.5.2.7.2h7.9c.3 0 .5-.1.7-.2.3-.1.5-.4.7-.7.1-.3.1-.6-.1-.9L12 4.8z"/></svg>
              </div>
              <div class="need__body">
                <div class="need__meta">
                  <span class="need__label">Drinken</span>
                  <span class="need__value" id="thirst-value">62%</span>
                </div>
                <div class="need__track">
                  <div class="need__fill need__fill--thirst" id="thirst-fill" style="width:62%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="status-right">
          <div class="info-block info-block--id">
            <span class="info-block__label">ID</span>
            <span class="info-block__value" id="player-id">42</span>
          </div>
          <div class="info-block">
            <span class="info-block__label">Job 2</span>
            <span class="info-block__value" id="job2">Monteur</span>
          </div>
          <div class="info-block">
            <span class="info-block__label">Job 1</span>
            <span class="info-block__value" id="job1">Politie</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="vitals" id="vitals">
      <div class="vital" data-vital="health" title="Leven">
        <div class="vital__ring">
          <svg viewBox="0 0 40 40">
            <circle class="vital__track" cx="20" cy="20" r="16" />
            <circle class="vital__arc vital__arc--health" id="health-arc" cx="20" cy="20" r="16" />
          </svg>
          <svg class="vital__icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.4 10.4 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.4 11.5L12 21.4z"/></svg>
        </div>
      </div>
      <div class="vital" data-vital="armor" title="Armor">
        <div class="vital__ring">
          <svg viewBox="0 0 40 40">
            <circle class="vital__track" cx="20" cy="20" r="16" />
            <circle class="vital__arc vital__arc--armor" id="armor-arc" cx="20" cy="20" r="16" />
          </svg>
          <svg class="vital__icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6.1c0 5.1 3.4 9.8 8 11 4.6-1.2 8-5.9 8-11V5l-8-3zm0 2.2 6 2.2v4.7c0 4-2.6 7.7-6 8.8-3.4-1.1-6-4.8-6-8.8V6.4l6-2.2z"/></svg>
        </div>
      </div>
      <div class="vital" data-vital="stamina" title="Stamina">
        <div class="vital__ring">
          <svg viewBox="0 0 40 40">
            <circle class="vital__track" cx="20" cy="20" r="16" />
            <circle class="vital__arc vital__arc--stamina" id="stamina-arc" cx="20" cy="20" r="16" />
          </svg>
          <svg class="vital__icon" viewBox="0 0 24 24"><path fill="currentColor" d="M13.2 2.1 7.4 12.3h4.1l-1.5 9.6 7.3-12.2h-4.3l2.2-7.6z"/></svg>
        </div>
      </div>
      <div class="vital vital--voice" id="voice-wrap" data-vital="voice" title="Voice">
        <div class="vital__ring">
          <svg viewBox="0 0 40 40">
            <circle class="vital__track" cx="20" cy="20" r="16" />
            <circle class="vital__arc vital__arc--voice" id="voice-arc" cx="20" cy="20" r="16" />
          </svg>
          <svg class="vital__icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>
        </div>
      </div>
    </div>

    <div class="money is-visible" id="money" aria-hidden="false">
      <div class="money__row">
        <span class="money__label">Cash</span>
        <span class="money__value" id="cash">€2.450</span>
      </div>
      <div class="money__row">
        <span class="money__label">Bank</span>
        <span class="money__value" id="bank">€12.800</span>
      </div>
    </div>

    <div class="location is-visible" id="location" aria-hidden="false">
      <span class="location__street" id="street">Power Street</span>
      <span class="location__zone" id="zone">Pillbox Hill</span>
    </div>
  </div>

  <div class="controls">
    <button type="button" id="btn-low">Lage needs</button>
    <button type="button" id="btn-full">Vol</button>
    <button type="button" id="btn-talk">Toggle voice</button>
  </div>

  <script src="app.js"></script>
  <script>
    const CIRC = 2 * Math.PI * 16;
    function setArc(id, pct) {
      const arc = document.getElementById(id);
      const offset = CIRC - (CIRC * pct) / 100;
      arc.style.strokeDasharray = String(CIRC);
      arc.style.strokeDashoffset = String(offset);
    }
    setArc('health-arc', 92);
    setArc('armor-arc', 40);
    setArc('stamina-arc', 70);
    setArc('voice-arc', 66);

    document.getElementById('btn-low').onclick = () => {
      window.postMessage({ action: 'update', data: { hunger: 12, thirst: 8, health: 22 } }, '*');
    };
    document.getElementById('btn-full').onclick = () => {
      window.postMessage({ action: 'update', data: { hunger: 100, thirst: 100, health: 100, armor: 100, stamina: 100 } }, '*');
    };
    let talking = false;
    document.getElementById('btn-talk').onclick = () => {
      talking = !talking;
      window.postMessage({ action: 'update', data: { talking } }, '*');
    };
  </script>
</body>
</html>
