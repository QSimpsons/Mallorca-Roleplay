<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotodoek preview — Eclipse RP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem;
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Segoe UI", sans-serif;
    }
    h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.04em; }
    .stage-wrap {
      width: min(920px, 94vw);
      perspective: 1200px;
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 11;
      transform-style: preserve-3d;
      transform: rotateX(18deg);
      transform-origin: 50% 70%;
    }
    .wall {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 4%;
      height: 58%;
      background: #020617;
      border-radius: 2px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transform-origin: bottom center;
    }
    .floor {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 62%;
      height: 34%;
      background: #020617;
      border-radius: 0 0 2px 2px;
      overflow: hidden;
      transform: rotateX(72deg);
      transform-origin: top center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .pole {
      position: absolute;
      top: 2%;
      height: 60%;
      width: 10px;
      background: linear-gradient(90deg, #111, #2a2a2e 40%, #111);
      border-radius: 2px;
      z-index: 4;
    }
    .pole.left { left: 7%; }
    .pole.right { right: 7%; }
    .bar {
      position: absolute;
      top: 1.5%;
      left: 6.8%;
      right: 6.8%;
      height: 12px;
      background: linear-gradient(180deg, #1a1a1e, #0a0a0c);
      border-radius: 2px;
      z-index: 5;
    }
    .wall iframe,
    .floor iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .floor iframe {
      transform: scaleY(1.15);
      transform-origin: top center;
      filter: brightness(0.92);
    }
    p { font-size: 0.9rem; opacity: 0.7; max-width: 42rem; text-align: center; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>FOTODOEK PREVIEW — ECLIPSE ROLEPLAY</h1>
  <div class="stage-wrap">
    <div class="stage">
      <div class="bar"></div>
      <div class="pole left"></div>
      <div class="pole right"></div>
      <div class="wall">
        <iframe
          title="wanddoek"
          src="doek.html?title=ECLIPSE&subtitle=ROLEPLAY&bg=%230b2f7a&accent=%233b82f6&color=%23ffffff&logo=img/logo.jpg"
        ></iframe>
      </div>
      <div class="floor">
        <iframe
          title="vloerdoek"
          src="doek.html?title=ECLIPSE&subtitle=ROLEPLAY&bg=%230b2f7a&accent=%233b82f6&color=%23ffffff&logo=img/logo.jpg"
        ></iframe>
      </div>
    </div>
  </div>
  <p>
    In-game: <code>/doek</code> plaatst wand + vloerdoek. Het print loopt door over de grond
    (<code>Config.VloerDiepte</code>).
  </p>
</body>
</html>
