<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eclipse Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="nui-hidden">
  <div id="store-root" aria-hidden="true">
    <div class="store-frame">
      <div class="topbar" id="topbar"></div>

      <header class="site-header">
        <div class="brand">
          <div class="brand-mark" id="brand-mark">
            <img src="logo.png" alt="Eclipse Store" onerror="this.remove(); this.parentElement.innerHTML='<span>Eclipse<br>Store</span>';">
          </div>
          <div class="brand-name" id="brand-name">Eclipse Store</div>
        </div>
        <nav class="main-nav">
          <button type="button" class="nav-link is-active" data-view="shop">Shop</button>
          <button type="button" class="nav-link" data-view="basket">Winkelwagen</button>
          <a href="#" id="webstore-link">Webstore</a>
        </nav>
        <div class="header-actions">
          <button class="pill" type="button" data-view="basket" id="cart-pill">
            Winkelwagen <span class="cart-count" id="cart-count" hidden>0</span>
          </button>
          <button class="close-btn" type="button" id="close-btn" aria-label="Sluiten">×</button>
        </div>
      </header>

      <div class="store-scroll">
        <div id="demo-banner" class="demo-banner" hidden></div>
        <div class="shell">
          <aside>
            <div class="sidebar-card">
              <div class="sidebar-title">Categorieën</div>
              <div class="cat-list" id="cat-list"></div>
              <div class="sidebar-foot"></div>
            </div>
          </aside>
          <main id="app">
            <div class="loading-block">
              <div class="spinner"></div>
              Catalogus laden…
            </div>
          </main>
        </div>
        <footer class="site-footer">
          <div id="footer-left">&copy; Eclipse Roleplay — betalingen via Tebex</div>
          <div>Druk ESC om te sluiten</div>
        </footer>
      </div>

      <div class="toast-host" id="toast-host"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
