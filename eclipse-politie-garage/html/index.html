<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Politie Garage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app" aria-hidden="true">
    <section class="shell" role="dialog" aria-labelledby="brand-title">
      <aside class="sidebar">
        <header class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" width="28" height="28">
              <path fill="currentColor" d="M20 3l3.2 7.4L31 12l-5.4 5 1.5 7.8L20 21.4 12.9 24.8l1.5-7.8L9 12l7.8-1.6L20 3z"/>
              <circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/>
            </svg>
          </div>
          <div>
            <h1 id="brand-title">POLITIE GARAGE</h1>
            <p id="location">Mission Row</p>
          </div>
        </header>

        <nav id="categories" class="categories" aria-label="Categorieën"></nav>

        <footer class="sidebar-foot">
          <span id="grade-label">Rang —</span>
          <button type="button" id="btn-close" class="icon-btn" title="Sluiten" aria-label="Sluiten">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
          </button>
        </footer>
      </aside>

      <main class="main">
        <header class="main-top">
          <div>
            <h2 id="cat-title">Patrouille</h2>
            <p id="cat-count" class="muted">0 voertuigen</p>
          </div>
          <label class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
            <input id="search" type="search" placeholder="Zoek voertuig…" autocomplete="off" />
          </label>
        </header>

        <div id="grid" class="grid" role="list"></div>
        <div id="empty" class="empty hidden">Geen voertuigen in deze categorie.</div>
      </main>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
