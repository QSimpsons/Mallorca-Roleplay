{% extends "layout.html" %}

{% block content %}
    <section class="section-head">
        <h1>{{ title }}</h1>
    </section>
    <article class="cms-card">
        {% if metaData.content is defined %}
            {{ metaData.content|raw }}
        {% elseif content is defined %}
            {{ content|raw }}
        {% endif %}
    </article>
{% endblock %}
