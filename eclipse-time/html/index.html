<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tijd en weer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay" class="overlay hidden">
        <div class="panel" role="dialog" aria-label="Tijd en weer">
            <div id="sky" class="sky" aria-hidden="true">
                <svg class="sky-day" viewBox="0 0 900 168" preserveAspectRatio="xMidYMid slice">
                    <rect width="860" height="168" fill="#b7e6fb"/>
                    <g transform="translate(742 58)">
                        <g fill="#f0a800">
                            <polygon points="0,-46 6,-26 -6,-26"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(30)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(60)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(90)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(120)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(150)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(180)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(210)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(240)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(270)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(300)"/>
                            <polygon points="0,-46 6,-26 -6,-26" transform="rotate(330)"/>
                        </g>
                        <circle r="22" fill="#ffd23a"/>
                        <path d="M-18 2a18 16 0 0 0 36 0" fill="#f5a400"/>
                    </g>
                    <g fill="#ffffff">
                        <ellipse cx="92" cy="58" rx="46" ry="20"/>
                        <ellipse cx="128" cy="48" rx="28" ry="18"/>
                        <ellipse cx="62" cy="54" rx="22" ry="14"/>
                        <ellipse cx="230" cy="92" rx="52" ry="22"/>
                        <ellipse cx="268" cy="80" rx="30" ry="18"/>
                        <ellipse cx="196" cy="86" rx="24" ry="15"/>
                        <ellipse cx="390" cy="46" rx="34" ry="16"/>
                        <ellipse cx="418" cy="40" rx="18" ry="13"/>
                        <ellipse cx="500" cy="108" rx="40" ry="16"/>
                        <ellipse cx="532" cy="100" rx="20" ry="13"/>
                        <ellipse cx="150" cy="128" rx="26" ry="12"/>
                        <ellipse cx="610" cy="70" rx="22" ry="11"/>
                    </g>
                </svg>
                <svg class="sky-night" viewBox="0 0 900 168" preserveAspectRatio="xMidYMid slice">
                    <rect width="860" height="168" fill="#101c45"/>
                    <g fill="#f4f7ff">
                        <circle cx="48" cy="28" r="1.3"/>
                        <circle cx="96" cy="70" r="1"/>
                        <circle cx="250" cy="26" r="1.2"/>
                        <circle cx="300" cy="58" r="1"/>
                        <circle cx="360" cy="22" r="1.4"/>
                        <circle cx="430" cy="48" r="1"/>
                        <circle cx="490" cy="20" r="1.2"/>
                        <circle cx="540" cy="64" r="1"/>
                        <circle cx="610" cy="30" r="1.5"/>
                        <circle cx="680" cy="52" r="1"/>
                        <circle cx="740" cy="24" r="1.2"/>
                        <circle cx="800" cy="46" r="1"/>
                        <circle cx="820" cy="90" r="1.1"/>
                        <circle cx="70" cy="120" r="1"/>
                        <circle cx="390" cy="110" r="1.2"/>
                        <circle cx="760" cy="120" r="1"/>
                        <path d="M210 36l1.1 2.8 2.8 1.1-2.8 1.1-1.1 2.8-1.1-2.8-2.8-1.1 2.8-1.1z"/>
                        <path d="M330 96l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z"/>
                        <path d="M470 78l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z"/>
                        <path d="M590 96l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z"/>
                        <path d="M700 88l1.3 3.2 3.2 1.3-3.2 1.3-1.3 3.2-1.3-3.2-3.2-1.3 3.2-1.3z"/>
                        <path d="M40 88l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z"/>
                        <path d="M820 130l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z"/>
                    </g>
                    <g transform="translate(168 84)">
                        <circle r="38" fill="#d7dbe2"/>
                        <circle cx="-12" cy="-10" r="9" fill="#c3c8d1"/>
                        <circle cx="10" cy="8" r="11" fill="#c5cad3"/>
                        <circle cx="-4" cy="14" r="6" fill="#c8ced6"/>
                        <circle cx="14" cy="-12" r="5" fill="#cfd4dc"/>
                        <circle cx="-18" cy="8" r="4" fill="#caced6"/>
                    </g>
                </svg>
            </div>
            <div class="body">
                <div id="time-label" class="time-label">5:00 PM</div>
                <input id="time-slider" class="time-slider" type="range" min="0" max="1439" value="1020" aria-label="Tijd">
                <div id="weathers" class="weathers"></div>
                <div id="toggles" class="toggles"></div>
                <div class="actions">
                    <button type="button" id="btn-save" class="btn save">Save Settings</button>
                    <button type="button" id="btn-change" class="btn change">Change</button>
                    <button type="button" id="btn-close" class="btn close">Close</button>
                </div>
                <div id="toast" class="toast" role="status"></div>
            </div>
        </div>
    </div>
    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
