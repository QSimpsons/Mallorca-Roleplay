<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="box">
        <div class="title">⚒ Mallorca Taakstraf</div>

        <div class="divider"></div>

        <div class="info-row">
            <span class="info-label">📋 Taken over</span>
            <span class="info-value" id="left">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">👤 Opgelegd door</span>
            <span class="info-value" id="by">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">📝 Reden</span>
            <span class="info-value" id="reason">-</span>
        </div>

        <div id="progress-wrap">
            <div class="progress-label">Voortgang taak</div>
            <div id="progress">
                <div id="progress-bar"></div>
                <div id="progress-glow"></div>
            </div>
            <div class="progress-pct" id="progress-pct">0%</div>
        </div>

        <div class="store-banner">
            🛒 Taakstraffen wegkopen? Doe <strong>/store</strong>!
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
